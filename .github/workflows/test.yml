name: Test application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
      - run: ./tests/Test-Collector.ps1
        shell: powershell
      - run: ./tests/Test-Server.ps1
        shell: powershell
      - name: PowerShell HTTP smoke test
        shell: powershell
        run: |
          $server = Start-Process powershell.exe -ArgumentList '-NoProfile','-File','scripts/Start-HealthCheck.ps1','-NoBrowser' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { $ready = (Invoke-RestMethod http://127.0.0.1:8000/api/health).mode -eq 'powershell'; if ($ready) { break } } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'PowerShell HTTP server did not start.' }
            ./tests/Test-Http.ps1
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
